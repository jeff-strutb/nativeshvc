<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>How nativeshvc is built</title>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b2a41">nativeshvc: a native engine for decompiled SNES games</text>

  <rect x="40" y="60" width="880" height="110" rx="10" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text x="60" y="88" font-weight="bold" fill="#1b2a41">The game: its C, converted to call the API</text>
  <text x="60" y="114" fill="#1b2a41">init, update (fixed rate), draw (once per picture), shutdown</text>
  <text x="60" y="136" fill="#1b2a41">music tick (audio thread), shaders (*.shade), packaged data, its own chip logic feeding draw lists</text>
  <text x="60" y="158" fill="#1b2a41">Built and packaged for each platform by tools/nshvc-build</text>

  <rect x="40" y="186" width="880" height="44" rx="10" fill="#fdf0d5" stroke="#b7791f"/>
  <text x="480" y="214" font-weight="bold" text-anchor="middle" fill="#1b2a41">The API  ·  nshvc/nshvc.h  ·  version 6.0  ·  docs/api.md</text>

  <rect x="40" y="246" width="880" height="170" rx="10" fill="#edf7ed" stroke="#2f855a"/>
  <text x="60" y="274" font-weight="bold" fill="#1b2a41">The engine  ·  src/engine</text>
  <g fill="#ffffff" stroke="#2f855a">
    <rect x="60" y="290" width="190" height="110" rx="6"/>
    <rect x="270" y="290" width="190" height="110" rx="6"/>
    <rect x="480" y="290" width="190" height="110" rx="6"/>
    <rect x="690" y="290" width="210" height="110" rx="6"/>
  </g>
  <g fill="#1b2a41">
    <text x="72" y="314" font-weight="bold">Loop and threads</text>
    <text x="72" y="338">system, game, render,</text>
    <text x="72" y="358">audio, job pool</text>
    <text x="72" y="382">state depends only on input</text>
    <text x="282" y="314" font-weight="bold">Picture</text>
    <text x="282" y="338">objects as textures, by line</text>
    <text x="282" y="358">capabilities as native draws</text>
    <text x="282" y="382">draw lists, overlays</text>
    <text x="492" y="314" font-weight="bold">Sound</text>
    <text x="492" y="338">voices, envelopes, echo</text>
    <text x="492" y="358">32,040 Hz</text>
    <text x="492" y="382">game's music code</text>
    <text x="702" y="314" font-weight="bold">Input, saves, data</text>
    <text x="702" y="338">devices mapped to controls</text>
    <text x="702" y="358">native save files</text>
    <text x="702" y="382">profiling, inspection</text>
  </g>

  <rect x="40" y="432" width="430" height="150" rx="10" fill="#f3e8fd" stroke="#6b46c1"/>
  <text x="60" y="460" font-weight="bold" fill="#1b2a41">Renderers  ·  src/render  ·  rr.h</text>
  <text x="60" y="486" fill="#1b2a41">textures, targets, depth, stencil, blend state,</text>
  <text x="60" y="506" fill="#1b2a41">instanced draws, programs: nothing of a console</text>
  <text x="60" y="530" fill="#1b2a41">drawn at the window's resolution</text>
  <text x="60" y="554" fill="#1b2a41">Metal, Vulkan, Direct3D 12</text>

  <rect x="490" y="432" width="430" height="150" rx="10" fill="#fde8ef" stroke="#b8336a"/>
  <text x="510" y="460" font-weight="bold" fill="#1b2a41">Hosts  ·  src/host  ·  host.h</text>
  <text x="510" y="486" fill="#1b2a41">window, input, audio, files, threads, per platform</text>
  <text x="510" y="510" fill="#1b2a41">macOS, iOS, Windows, Linux, Android, headless</text>
  <text x="510" y="534" fill="#1b2a41">A new platform implements host.h,</text>
  <text x="510" y="554" fill="#1b2a41">and rr.h if it needs a new GPU API</text>

  <text x="480" y="606" text-anchor="middle" fill="#555555">Checks live in tests/ and tools/nshvc-check. No emulation runs in the engine.</text>
</svg>
